name: Gerar Release Executável

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Rebuild sqlite3
        run: npm rebuild sqlite3

      - name: Gerar Executável
        run: npm run build

      - name: Organizar arquivos
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release_zip/database
          Copy-Item dist/fila-agentes.exe release_zip/
          
          if (Test-Path config.json) {
            Copy-Item config.json release_zip/
          }

          if (Test-Path database/db.sqlite) {
            Copy-Item database/db.sqlite release_zip/database/
          }

          Compress-Archive -Path release_zip/* -DestinationPath fila-agentes-completo.zip

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          files: fila-agentes-completo.zip
          name: Fila de Agentes ${{ github.ref_name }}
          body: Release automática
