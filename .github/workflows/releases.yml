name: Gerar Release Executável

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Gerar Executável (Build)
        run: npm run build

      - name: Criar Release e Upload do .exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fila-agentes.exe
          name: Fila de Agentes ${{ github.ref_name }}
          body: "Release automática. Baixe o arquivo .exe para rodar no Windows."
          draft: false
          prerelease: false
