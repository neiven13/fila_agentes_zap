name: Gerar Release Executável

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Gerar Executável (Build)
        run: npm run build

      - name: Organizar Arquivos da Release
        run: |
          mkdir -p release_zip/database
          cp dist/fila-agentes.exe release_zip/
          cp config.json release_zip/ || true
          cp database/db.sqlite release_zip/database/ || touch release_zip/database/db.sqlite
          zip -r fila-agentes-completo.zip release_zip/*

      - name: Criar Release e Upload do Pack
        uses: softprops/action-gh-release@v2
        with:
          files: fila-agentes-completo.zip
          name: Fila de Agentes ${{ github.ref_name }}
          body: "Release automática. Extraia o ZIP e execute o fila-agentes.exe."
          draft: false
          prerelease: false