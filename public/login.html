<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso - Painel Atendimento</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --grad-inicio: #040722;
      --grad-fim: #0a080e;
      --card-bg: rgba(43, 39, 39, 0.233);
      --input-bg: #1a1c23;
      --text-main: #e0e6ed;
      --text-dim: #94a3b8;
      --accent: #6c63ff;
      --accent-hover: #5a52d4;
      --radius: 24px;
      --lock-color: #d4c926;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--grad-inicio) 0%, var(--grad-fim) 100%);
      background-attachment: fixed;
      color: var(--text-main);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: var(--accent);
      filter: blur(150px);
      opacity: 0.05;
      z-index: -1;
    }

    .login-card {
      background: var(--card-bg);
      padding: 3.5rem 2.5rem;
      border-radius: var(--radius);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 360px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .login-card {
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(50px);
        }

    .logo-icon {
      width: 80px;
      height: 80px;
      background: rgba(241, 196, 15, 0.08);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      border: 1px solid rgba(241, 196, 15, 0.15);
      color: var(--lock-color);
      transition: all 0.3s ease;
    }

    /* Estilo específico para o SVG do ícone */
    .logo-icon svg {
      width: 50px;
      height: 50px;
    }

    h2 {
      margin: 0 0 0.5rem;
      font-weight: 600;
      font-size: 1.6rem;
    }

    p {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--input-bg);
      color: white;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      box-sizing: border-box;
      transition: all 0.3s ease;
      text-align: center;
      letter-spacing: 2px;
    }

    input:focus {
      border-color: var(--accent);
      background: #22252e;
      box-shadow: 0 0 15px rgba(108, 99, 255, 0.15);
    }

    button {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: white;
      font-family: inherit;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(108, 99, 255, 0.2);
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(108, 99, 255, 0.3);
    }

    /* Animação shake para erro */
    .error-shake {
      animation: shake 0.4s ease-in-out;
      border-color: #ff5f5f !important;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-8px);
      }

      75% {
        transform: translateX(8px);
      }
    }
  </style>
</head>

<body>

  <div class="login-card" id="card">
    <div class="logo-icon">
      <i data-lucide="lock"></i>
    </div>
    <h2>Bem-vindo</h2>
    <p>Insira seu token para começar</p>

    <div class="input-group">
      <input id="token" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button onclick="login()">Acessar Painel</button>
  </div>

  <script>
    // 4. INICIALIZAÇÃO CORRETA DOS ÍCONES
    // Aguarda o DOM carregar completamente para transformar as tags <i> em SVGs
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    async function login() {
      const input = document.getElementById('token');
      const token = input.value;

      if (!token) {
        animarErro();
        return;
      }

      try {
        const res = await fetch('/agents/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
          credentials: 'include'
        });

        const data = await res.json();

        if (res.status !== 200) {
          animarErro();
          alert(data.erro || 'Token inválido');
          return;
        }

        if (data.redirect) {
          window.location.href = data.redirect;
        } else {
          window.location.href = data.tipo === 'admin' ? '/admin' : '/agente';
        }

      } catch (error) {
        console.error('Erro ao processar login:', error);
        alert('Erro de conexão com o servidor.');
      }
    }

    function animarErro() {
      const input = document.getElementById('token');
      input.classList.add('error-shake');
      setTimeout(() => input.classList.remove('error-shake'), 400);
    }

    document.getElementById('token').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>

</body>

</html>
